[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "why-are-you-running"
version = "0.1.0"
description = "Find what keeps your Mac awake (and hot) while it's supposed to be asleep."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
wayr = "wayr.cli:main"

[tool.setuptools]
packages = ["wayr"]
